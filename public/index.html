<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUSE · HERO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#111827;background:#080c15;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}img{display:block;max-width:100%}a{color:inherit}#app{min-height:100dvh}
    .login{min-height:100dvh;display:grid;place-items:center;overflow:hidden;position:relative;background:radial-gradient(circle at 20% 14%,#292039 0,transparent 31%),radial-gradient(circle at 83% 80%,#501424 0,transparent 35%),#080c15;color:#fff;padding:24px}
    .login:before{content:"";position:absolute;inset:-30%;opacity:.22;background:repeating-linear-gradient(60deg,transparent 0 28px,#b8b9d222 29px 30px),repeating-linear-gradient(120deg,transparent 0 28px,#b8b9d222 29px 30px);transform:perspective(800px) rotateX(30deg) scale(1.2);animation:drift 26s linear infinite}
    .login:after{content:"";position:absolute;width:640px;height:640px;border:1px solid #e9426850;border-radius:50%;box-shadow:0 0 0 90px #e9426809,0 0 0 180px #e9426807,0 0 100px #a9214850;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
    @keyframes drift{to{transform:perspective(800px) rotateX(30deg) translateY(60px) scale(1.2)}}
    .login-card{z-index:1;width:min(100%,470px);padding:38px;background:#101522e8;border:1px solid #ffffff2a;border-radius:26px;box-shadow:0 28px 100px #0009;backdrop-filter:blur(20px)}
    .login-logo{width:176px;max-height:90px;object-fit:contain;margin:0 auto 25px}.login-mark{text-transform:uppercase;letter-spacing:.24em;text-align:center;font-size:11px;font-weight:800;color:#fa7289}.login h1{text-align:center;font-size:32px;letter-spacing:-.04em;margin:11px 0 7px}.login p{text-align:center;color:#aeb8c9;line-height:1.5;margin:0 0 28px;font-size:14px}
    label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 9px;color:#d8deeb}input{width:100%;background:#080d19;color:#fff;border:1px solid #465168;border-radius:12px;padding:14px 15px;outline:none}input:focus{border-color:#f05a77;box-shadow:0 0 0 3px #f05a772c}.primary{width:100%;border:0;border-radius:12px;background:linear-gradient(110deg,#e02d50,#a8082b);color:#fff;padding:15px 18px;margin-top:16px;font-weight:800;box-shadow:0 10px 26px #a8082b55}.secondary{background:none;border:0;color:#d2dae7;text-decoration:underline;margin-top:15px;padding:3px}.form-foot{text-align:center}.message{min-height:22px;color:#ff9bac;text-align:center;font-size:13px;margin-top:14px}.login-note{font-size:11px;color:#7e8aa0;text-align:center;margin-top:20px}
    .shell{min-height:100dvh;background:#f7f8fb}.top{height:68px;background:#fff;border-bottom:1px solid #e3e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:20px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:88px;filter:brightness(0)}.brand-divider{height:25px;border-left:1px solid #dce1e8}.brand strong{font-size:13px;letter-spacing:.1em}.top-user{display:flex;align-items:center;gap:14px;min-width:0}.top-user span{font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.signout{background:#fff;border:1px solid #d9deea;border-radius:9px;padding:9px 12px;color:#374151;font-weight:700;font-size:12px}
    .layout{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100dvh - 68px)}aside{background:#0d1424;color:#fff;padding:23px 15px;display:flex;flex-direction:column;gap:22px}aside .hero-logo{width:136px;max-height:75px;object-fit:contain;margin:5px auto 0}aside .aside-title{font-size:10px;font-weight:800;letter-spacing:.2em;color:#8c9ab2;padding:0 10px}aside .nav{width:100%;border:1px solid #f1738740;background:linear-gradient(105deg,#b20c31,#8f0926);color:#fff;border-radius:11px;padding:13px 12px;text-align:left;font-size:13px;font-weight:800;box-shadow:0 10px 23px #9e183055}aside .nav small{display:block;font-weight:500;color:#ffd4dc;margin-top:4px}aside .scope{margin-top:auto;border-top:1px solid #ffffff1d;padding:17px 9px 0;font-size:11px;line-height:1.5;color:#9faec2}
    main{min-width:0}.page-head{background:#fff;border-bottom:1px solid #e3e7ef;padding:26px clamp(18px,3vw,50px)}.eyebrow{color:#9e1830;font-size:10px;font-weight:900;letter-spacing:.18em}.page-head h1{margin:7px 0 3px;font-size:25px;letter-spacing:-.04em}.page-head p{margin:0;color:#718096;font-size:12px}.frame-wrap{padding:20px clamp(10px,2vw,30px)}iframe{width:100%;height:calc(100dvh - 180px);min-height:720px;border:1px solid #e2e6ed;background:#fff;border-radius:14px;box-shadow:0 12px 35px #1118270d}
    .loading{min-height:100dvh;display:grid;place-items:center;background:#0a0f1c;color:#fff;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
    @media(max-width:800px){.layout{display:block}aside{padding:12px 16px;display:flex;flex-direction:row;align-items:center}aside .hero-logo{width:68px;margin:0}aside .aside-title,aside .scope{display:none}aside .nav{width:auto;flex:1}.page-head{padding:20px}.top{padding:0 14px}.brand strong{font-size:11px}.top-user span{display:none}.frame-wrap{padding:9px}iframe{min-height:820px;height:calc(100dvh - 175px)}}
  </style>
  <link rel="stylesheet" href="/login-original.css">
  <link rel="stylesheet" href="/shell.css">
</head>
<body><div id="app" class="loading">Cargando MUSE</div>
<script src="/app.js"></script></body></html>
